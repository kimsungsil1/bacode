<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>아몬드영 바코드 생성기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --card: #f9fafb;
      --border: #e5e7eb;
      --focus: #111827;
      --point: #2563eb;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      display: grid;
      gap: 24px;
    }

    header {
      text-align: center;
      display: grid;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
    }

    .layout {
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      display: grid;
      gap: 12px;
    }

    .card h2 {
      margin: 0;
      font-size: 18px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select,
    button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    input:focus,
    select:focus,
    button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    input[type="number"] {
      text-align: right;
    }

    .inline {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .btn {
      cursor: pointer;
      background: var(--point);
      color: white;
      border: none;
      font-weight: 600;
    }

    .btn.secondary {
      background: #0f172a;
    }

    .btn.ghost {
      background: transparent;
      color: var(--point);
      border: 1px solid var(--point);
    }

    .helper {
      font-size: 13px;
      color: var(--muted);
    }

    .status {
      font-size: 14px;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .preview {
      display: grid;
      gap: 12px;
    }

    .preview-stage {
      min-height: 220px;
      display: grid;
      place-items: center;
      background: #fff;
      border-radius: 12px;
      border: 1px dashed var(--border);
      padding: 16px;
      overflow: auto;
    }

    .label-canvas {
      background: #fff;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      position: relative;
    }

    .label-note {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .preset-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .margin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    footer {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .page {
        padding: 24px 16px 40px;
      }

      .card {
        padding: 16px;
      }

      .margin-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>아몬드영 바코드 생성기</h1>
      <p class="helper">입력과 옵션을 변경하면 즉시 미리보기가 갱신됩니다.</p>
    </header>

    <section class="layout">
      <div class="card">
        <h2>입력</h2>
        <div class="field">
          <label for="barcode-data">바코드 데이터 (Code128)</label>
          <input id="barcode-data" type="text" inputmode="text" autocomplete="off" placeholder="예: ALMNDYOUNG-001" />
          <div id="validation" class="status" role="status" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="label-text">표시 텍스트(라벨용)</label>
          <input id="label-text" type="text" inputmode="text" autocomplete="off" placeholder="예: 아몬드영 기획팀" />
        </div>

        <div class="field inline">
          <label class="toggle" for="show-label-text">
            <input id="show-label-text" type="checkbox" checked />
            라벨 텍스트 표시
          </label>
        </div>

        <h2>사이즈 & 여백</h2>
        <div class="field inline">
          <label for="width-cm">가로(cm)</label>
          <input id="width-cm" type="number" min="0" step="0.1" value="6" />
          <label for="height-cm">세로(cm)</label>
          <input id="height-cm" type="number" min="0" step="0.1" value="3" />
        </div>
        <div class="field inline">
          <label for="dpi">DPI</label>
          <input id="dpi" type="number" min="72" step="1" value="300" />
        </div>
        <div class="field">
          <label for="margin-all">전체 여백(cm)</label>
          <input id="margin-all" type="number" min="0" step="0.1" value="0.2" />
          <p class="helper">고급 여백을 켜면 개별 여백이 우선 적용됩니다.</p>
        </div>
        <div class="field inline">
          <label class="toggle" for="use-advanced-margin">
            <input id="use-advanced-margin" type="checkbox" />
            여백 개별 설정
          </label>
        </div>
        <div class="margin-grid" id="margin-grid" aria-hidden="true">
          <div class="field">
            <label for="margin-top">상단 여백(cm)</label>
            <input id="margin-top" type="number" min="0" step="0.1" value="0.2" />
          </div>
          <div class="field">
            <label for="margin-right">우측 여백(cm)</label>
            <input id="margin-right" type="number" min="0" step="0.1" value="0.2" />
          </div>
          <div class="field">
            <label for="margin-bottom">하단 여백(cm)</label>
            <input id="margin-bottom" type="number" min="0" step="0.1" value="0.2" />
          </div>
          <div class="field">
            <label for="margin-left">좌측 여백(cm)</label>
            <input id="margin-left" type="number" min="0" step="0.1" value="0.2" />
          </div>
        </div>

        <div class="field">
          <label>프리셋</label>
          <div class="preset-group">
            <button class="btn ghost" type="button" data-preset="default">기본</button>
            <button class="btn ghost" type="button" data-preset="sticker">스티커(작게)</button>
            <button class="btn ghost" type="button" data-preset="box">박스(크게)</button>
          </div>
        </div>

        <h2>옵션</h2>
        <div class="field inline">
          <label class="toggle" for="show-barcode-text">
            <input id="show-barcode-text" type="checkbox" checked />
            바코드 내부 텍스트 표시
          </label>
        </div>
        <div class="field inline">
          <label for="barcode-font-size">바코드 텍스트 크기(px)</label>
          <input id="barcode-font-size" type="number" min="8" step="1" value="16" />
        </div>
        <div class="field inline">
          <label for="label-font-size">라벨 텍스트 크기(px)</label>
          <input id="label-font-size" type="number" min="8" step="1" value="14" />
        </div>
      </div>

      <div class="card">
        <h2>미리보기</h2>
        <div class="preview">
          <div class="preview-stage" id="preview-stage">
            <div class="label-canvas" id="label-canvas" aria-live="polite">
              <span class="helper" id="empty-message">데이터를 입력하면 라벨이 표시됩니다.</span>
            </div>
          </div>
          <div class="label-note" id="size-note"></div>
        </div>
        <div class="inline">
          <button class="btn" id="download-png" type="button">PNG 다운로드</button>
          <button class="btn secondary" id="download-svg" type="button">SVG 다운로드</button>
          <button class="btn ghost" id="copy-png" type="button">PNG 복사</button>
        </div>
        <div id="copy-status" class="status" role="status" aria-live="polite"></div>
      </div>
    </section>

    <footer>
      <p><strong>사용법 안내</strong></p>
      <ul>
        <li>바코드 데이터와 라벨 텍스트를 입력하면 즉시 미리보기가 갱신됩니다.</li>
        <li>가로/세로/여백을 cm 단위로 입력하면 DPI 기준 픽셀 크기로 정확히 반영됩니다.</li>
        <li>PNG/SVG 다운로드와 PNG 복사를 통해 출력물을 저장할 수 있습니다.</li>
        <li>크기가 너무 작으면 경고가 표시되니 값을 키워주세요.</li>
      </ul>
    </footer>
  </div>

  <canvas id="png-canvas" style="display:none"></canvas>

  <script>
    const barcodeDataInput = document.getElementById("barcode-data");
    const labelTextInput = document.getElementById("label-text");
    const showLabelText = document.getElementById("show-label-text");
    const showBarcodeText = document.getElementById("show-barcode-text");
    const barcodeFontSize = document.getElementById("barcode-font-size");
    const labelFontSize = document.getElementById("label-font-size");
    const widthCmInput = document.getElementById("width-cm");
    const heightCmInput = document.getElementById("height-cm");
    const dpiInput = document.getElementById("dpi");
    const marginAllInput = document.getElementById("margin-all");
    const useAdvancedMargin = document.getElementById("use-advanced-margin");
    const marginGrid = document.getElementById("margin-grid");
    const marginTopInput = document.getElementById("margin-top");
    const marginRightInput = document.getElementById("margin-right");
    const marginBottomInput = document.getElementById("margin-bottom");
    const marginLeftInput = document.getElementById("margin-left");

    const previewStage = document.getElementById("preview-stage");
    const labelCanvas = document.getElementById("label-canvas");
    const emptyMessage = document.getElementById("empty-message");
    const validation = document.getElementById("validation");
    const copyStatus = document.getElementById("copy-status");
    const sizeNote = document.getElementById("size-note");
    const canvas = document.getElementById("png-canvas");

    const downloadPng = document.getElementById("download-png");
    const downloadSvg = document.getElementById("download-svg");
    const copyPng = document.getElementById("copy-png");

    const PRESETS = {
      default: {
        widthCm: 6,
        heightCm: 3,
        marginCm: 0.2,
        dpi: 300,
        showBarcodeText: true,
        barcodeFontSize: 16,
        labelFontSize: 14
      },
      sticker: {
        widthCm: 4,
        heightCm: 2,
        marginCm: 0.2,
        dpi: 300,
        showBarcodeText: true,
        barcodeFontSize: 12,
        labelFontSize: 12
      },
      box: {
        widthCm: 8,
        heightCm: 4,
        marginCm: 0.3,
        dpi: 300,
        showBarcodeText: true,
        barcodeFontSize: 20,
        labelFontSize: 16
      }
    };

    const BARCODE_FORMAT = "CODE128";

    function toNumber(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : NaN;
    }

    function cmToPx(cm, dpi) {
      return (cm / 2.54) * dpi;
    }

    function formatPx(value) {
      return Math.round(value);
    }

    function setStatus(element, message, type = "") {
      element.textContent = message;
      element.className = type ? `status ${type}` : "status";
    }

    function sanitizeFilename(text) {
      const trimmed = text.trim();
      if (!trimmed) return "barcode";
      return trimmed.replace(/[^a-z0-9\-_.]+/gi, "-").slice(0, 24) || "barcode";
    }

    function getMargins() {
      const useAdvanced = useAdvancedMargin.checked;
      if (useAdvanced) {
        return {
          top: toNumber(marginTopInput.value),
          right: toNumber(marginRightInput.value),
          bottom: toNumber(marginBottomInput.value),
          left: toNumber(marginLeftInput.value)
        };
      }

      const all = toNumber(marginAllInput.value);
      return { top: all, right: all, bottom: all, left: all };
    }

    function validateInputs() {
      const widthCm = toNumber(widthCmInput.value);
      const heightCm = toNumber(heightCmInput.value);
      const dpi = toNumber(dpiInput.value);
      const margins = getMargins();

      if (!widthCm || widthCm <= 0 || !heightCm || heightCm <= 0) {
        return { valid: false, message: "가로/세로(cm)는 0보다 큰 값을 입력해주세요." };
      }

      if (!dpi || dpi <= 0) {
        return { valid: false, message: "DPI는 0보다 큰 값을 입력해주세요." };
      }

      const marginValues = Object.values(margins);
      if (marginValues.some((value) => !Number.isFinite(value) || value < 0)) {
        return { valid: false, message: "여백은 0 이상의 숫자로 입력해주세요." };
      }

      if (margins.left + margins.right >= widthCm || margins.top + margins.bottom >= heightCm) {
        return { valid: false, message: "여백 합이 라벨 크기보다 큽니다." };
      }

      return { valid: true, widthCm, heightCm, dpi, margins };
    }

    function createBarcodeSvg(data, options) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      JsBarcode(svg, data, {
        format: BARCODE_FORMAT,
        displayValue: options.displayValue,
        fontSize: options.fontSize,
        height: options.height,
        margin: 0
      });
      return svg;
    }

    function getSvgSize(svg) {
      const widthAttr = svg.getAttribute("width");
      const heightAttr = svg.getAttribute("height");
      const width = widthAttr ? Number(widthAttr) : svg.getBBox().width;
      const height = heightAttr ? Number(heightAttr) : svg.getBBox().height;
      return { width, height };
    }

    function buildLabelSvg({
      data,
      label,
      widthPx,
      heightPx,
      marginsPx,
      showLabel,
      showBarcodeValue,
      barcodeFont,
      labelFont
    }) {
      const labelTextHeight = showLabel && label ? labelFont * 1.4 : 0;
      const availableWidth = widthPx - marginsPx.left - marginsPx.right;
      const availableHeight = heightPx - marginsPx.top - marginsPx.bottom - labelTextHeight;

      const barcodeSvg = createBarcodeSvg(data, {
        displayValue: showBarcodeValue,
        fontSize: barcodeFont,
        height: Math.max(10, availableHeight)
      });

      const barcodeSize = getSvgSize(barcodeSvg);
      const scaleX = availableWidth / barcodeSize.width;
      const scaleY = availableHeight / barcodeSize.height;

      const serializer = new XMLSerializer();
      const barcodeContent = Array.from(barcodeSvg.childNodes)
        .map((node) => serializer.serializeToString(node))
        .join("");

      const labelFontFamily = "Pretendard, Apple SD Gothic Neo, Noto Sans KR, system-ui, sans-serif";
      const labelTextY = marginsPx.top + availableHeight + labelFont;
      const labelText = showLabel && label ? `<text x="${widthPx / 2}" y="${labelTextY}" text-anchor="middle" font-size="${labelFont}" font-family="${labelFontFamily}" fill="#111827">${label}</text>` : "";

      return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${widthPx}" height="${heightPx}" viewBox="0 0 ${widthPx} ${heightPx}">
  <rect width="100%" height="100%" fill="#ffffff" />
  <g transform="translate(${marginsPx.left}, ${marginsPx.top}) scale(${scaleX}, ${scaleY})" aria-label="Code128 바코드">
    ${barcodeContent}
  </g>
  ${labelText}
</svg>`;
    }

    function updatePreview() {
      const data = barcodeDataInput.value.trim();
      const label = labelTextInput.value.trim();
      const showLabel = showLabelText.checked;
      const showBarcodeValue = showBarcodeText.checked;
      const barcodeFont = toNumber(barcodeFontSize.value);
      const labelFont = toNumber(labelFontSize.value);

      setStatus(copyStatus, "");
      labelCanvas.innerHTML = "";

      if (!data) {
        emptyMessage.hidden = false;
        labelCanvas.appendChild(emptyMessage);
        setStatus(validation, "바코드 데이터를 입력해주세요.", "error");
        sizeNote.textContent = "";
        return;
      }

      const validationResult = validateInputs();
      if (!validationResult.valid) {
        emptyMessage.hidden = false;
        labelCanvas.appendChild(emptyMessage);
        setStatus(validation, validationResult.message, "error");
        sizeNote.textContent = "";
        return;
      }

      if (!Number.isFinite(barcodeFont) || barcodeFont <= 0 || !Number.isFinite(labelFont) || labelFont <= 0) {
        setStatus(validation, "폰트 크기는 0보다 큰 값을 입력해주세요.", "error");
        return;
      }

      const { widthCm, heightCm, dpi, margins } = validationResult;
      const widthPx = cmToPx(widthCm, dpi);
      const heightPx = cmToPx(heightCm, dpi);

      const marginsPx = {
        top: cmToPx(margins.top, dpi),
        right: cmToPx(margins.right, dpi),
        bottom: cmToPx(margins.bottom, dpi),
        left: cmToPx(margins.left, dpi)
      };

      const labelTextHeight = showLabel && label ? labelFont * 1.4 : 0;
      const availableWidth = widthPx - marginsPx.left - marginsPx.right;
      const availableHeight = heightPx - marginsPx.top - marginsPx.bottom - labelTextHeight;

      if (availableWidth <= 0 || availableHeight <= 0) {
        setStatus(validation, "여백 또는 라벨 텍스트 때문에 출력 영역이 부족합니다.", "error");
        return;
      }

      if (availableWidth < 60 || availableHeight < 30) {
        setStatus(validation, "크기를 키우세요. 현재 영역이 너무 작습니다.", "error");
      } else {
        setStatus(validation, "", "");
      }

      const svgString = buildLabelSvg({
        data,
        label,
        widthPx,
        heightPx,
        marginsPx,
        showLabel,
        showBarcodeValue,
        barcodeFont,
        labelFont
      });

      labelCanvas.style.width = `${formatPx(widthPx)}px`;
      labelCanvas.style.height = `${formatPx(heightPx)}px`;
      labelCanvas.innerHTML = svgString;
      sizeNote.textContent = `${widthCm}cm x ${heightCm}cm (DPI ${dpi}) → ${formatPx(widthPx)}px x ${formatPx(heightPx)}px`;
    }

    function getCurrentLabelSvg() {
      const svg = labelCanvas.querySelector("svg");
      if (!svg) return null;
      const serializer = new XMLSerializer();
      return serializer.serializeToString(svg);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function svgToPng(svgString, width, height) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const svgBlob = new Blob([svgString], { type: "image/svg+xml" });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(url);
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("PNG 변환에 실패했습니다."));
            }
          });
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("이미지 로드에 실패했습니다."));
        };

        img.src = url;
      });
    }

    async function handleDownloadPng() {
      const svgString = getCurrentLabelSvg();
      if (!svgString) {
        setStatus(copyStatus, "PNG 다운로드 전에 미리보기를 생성해주세요.", "error");
        return;
      }

      const svg = labelCanvas.querySelector("svg");
      const width = Number(svg.getAttribute("width"));
      const height = Number(svg.getAttribute("height"));

      try {
        const pngBlob = await svgToPng(svgString, width, height);
        const filename = `${sanitizeFilename(barcodeDataInput.value)}.png`;
        downloadBlob(pngBlob, filename);
        setStatus(copyStatus, "PNG 다운로드를 시작했습니다.", "success");
      } catch (error) {
        setStatus(copyStatus, "PNG 변환에 실패했습니다.", "error");
      }
    }

    function handleDownloadSvg() {
      const svgString = getCurrentLabelSvg();
      if (!svgString) {
        setStatus(copyStatus, "SVG 다운로드 전에 미리보기를 생성해주세요.", "error");
        return;
      }

      const blob = new Blob([svgString], { type: "image/svg+xml" });
      const filename = `${sanitizeFilename(barcodeDataInput.value)}.svg`;
      downloadBlob(blob, filename);
      setStatus(copyStatus, "SVG 다운로드를 시작했습니다.", "success");
    }

    async function handleCopyPng() {
      const svgString = getCurrentLabelSvg();
      if (!svgString) {
        setStatus(copyStatus, "복사 전에 미리보기를 생성해주세요.", "error");
        return;
      }

      if (!navigator.clipboard || !window.ClipboardItem) {
        setStatus(copyStatus, "이 브라우저에서는 PNG 복사가 지원되지 않습니다.", "error");
        return;
      }

      const svg = labelCanvas.querySelector("svg");
      const width = Number(svg.getAttribute("width"));
      const height = Number(svg.getAttribute("height"));

      try {
        const pngBlob = await svgToPng(svgString, width, height);
        await navigator.clipboard.write([new ClipboardItem({ "image/png": pngBlob })]);
        setStatus(copyStatus, "PNG가 클립보드에 복사되었습니다.", "success");
      } catch (error) {
        setStatus(copyStatus, "클립보드 복사에 실패했습니다.", "error");
      }
    }

    function toggleMarginGrid() {
      marginGrid.style.display = useAdvancedMargin.checked ? "grid" : "none";
      marginGrid.setAttribute("aria-hidden", useAdvancedMargin.checked ? "false" : "true");
    }

    function applyPreset(presetKey) {
      const preset = PRESETS[presetKey];
      if (!preset) return;

      widthCmInput.value = preset.widthCm;
      heightCmInput.value = preset.heightCm;
      marginAllInput.value = preset.marginCm;
      dpiInput.value = preset.dpi;
      showBarcodeText.checked = preset.showBarcodeText;
      barcodeFontSize.value = preset.barcodeFontSize;
      labelFontSize.value = preset.labelFontSize;
      useAdvancedMargin.checked = false;
      toggleMarginGrid();
      updatePreview();
    }

    document.querySelectorAll("[data-preset]").forEach((button) => {
      button.addEventListener("click", () => applyPreset(button.dataset.preset));
    });

    const inputs = [
      barcodeDataInput,
      labelTextInput,
      showLabelText,
      showBarcodeText,
      barcodeFontSize,
      labelFontSize,
      widthCmInput,
      heightCmInput,
      dpiInput,
      marginAllInput,
      marginTopInput,
      marginRightInput,
      marginBottomInput,
      marginLeftInput
    ];

    inputs.forEach((input) => {
      input.addEventListener("input", updatePreview);
      input.addEventListener("change", updatePreview);
    });

    useAdvancedMargin.addEventListener("change", () => {
      toggleMarginGrid();
      updatePreview();
    });

    downloadPng.addEventListener("click", handleDownloadPng);
    downloadSvg.addEventListener("click", handleDownloadSvg);
    copyPng.addEventListener("click", handleCopyPng);

    toggleMarginGrid();
    updatePreview();
  </script>
</body>
</html>
