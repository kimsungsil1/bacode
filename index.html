<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>아몬드영 바코드 생성기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --card: #f9fafb;
      --border: #e5e7eb;
      --primary: #111827;
      --accent: #2563eb;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      display: grid;
      gap: 24px;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    .layout {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    input,
    button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    input:focus,
    button:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 720px) {
      .option-grid {
        grid-template-columns: 1fr;
      }
    }

    .stepper {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 48px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    .stepper button {
      height: 48px;
      border: none;
      background: #eef2ff;
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .stepper button:active {
      background: #e0e7ff;
    }

    .stepper input {
      height: 48px;
      border: none;
      text-align: center;
      font-size: 17px;
      padding: 0 10px;
    }

    .stepper input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .status {
      font-size: 13px;
      color: var(--danger);
      min-height: 18px;
    }

    .preview {
      display: grid;
      gap: 12px;
    }

    .preview-stage {
      min-height: 220px;
      display: grid;
      place-items: center;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px;
    }

    .barcode-wrap {
      display: grid;
      justify-items: center;
      background: #fff;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
    }

    .btn.secondary {
      background: var(--primary);
    }

    .btn.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .helper {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>아몬드영 바코드 생성기</h1>
    </header>

    <section class="card">
      <div class="layout">
        <div class="form">
          <div class="field">
            <label for="barcode-data">바코드 데이터 (필수)</label>
            <input id="barcode-data" type="text" autocomplete="off" placeholder="예: ALMNDYOUNG-001" />
          </div>
          <div class="field">
            <label for="display-text">표시 텍스트 (라벨용)</label>
            <input id="display-text" type="text" autocomplete="off" placeholder="예: 아몬드영" />
          </div>
          <div class="field">
            <label class="toggle" for="display-label">
              <input id="display-label" type="checkbox" checked />
              라벨 표시
            </label>
          </div>

          <div class="option-grid">
            <div class="field">
              <label for="bar-width">폭 (Bar width)</label>
              <div class="stepper" data-stepper>
                <button type="button" data-step="down" aria-label="바코드 폭 줄이기">-</button>
                <input id="bar-width" type="number" min="0.5" max="6" step="0.1" value="2" />
                <button type="button" data-step="up" aria-label="바코드 폭 늘리기">+</button>
              </div>
            </div>
            <div class="field">
              <label for="bar-height">높이 (Height px)</label>
              <div class="stepper" data-stepper>
                <button type="button" data-step="down" aria-label="바코드 높이 줄이기">-</button>
                <input id="bar-height" type="number" min="20" max="300" step="5" value="80" />
                <button type="button" data-step="up" aria-label="바코드 높이 늘리기">+</button>
              </div>
            </div>
            <div class="field">
              <label for="bar-margin">여백 (Margin px)</label>
              <div class="stepper" data-stepper>
                <button type="button" data-step="down" aria-label="바코드 여백 줄이기">-</button>
                <input id="bar-margin" type="number" min="0" max="50" step="1" value="10" />
                <button type="button" data-step="up" aria-label="바코드 여백 늘리기">+</button>
              </div>
            </div>
            <div class="field">
              <label for="font-size">폰트 크기 (Font size)</label>
              <div class="stepper" data-stepper>
                <button type="button" data-step="down" aria-label="폰트 크기 줄이기">-</button>
                <input id="font-size" type="number" min="8" max="40" step="1" value="14" />
                <button type="button" data-step="up" aria-label="폰트 크기 늘리기">+</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="toggle" for="display-value">
              <input id="display-value" type="checkbox" checked />
              바코드 아래 숫자 표시 (Display value)
            </label>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>

        <div class="preview">
          <div class="preview-stage">
            <div class="barcode-wrap" id="barcode-wrap">
              <svg id="barcodeSvg"></svg>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn" id="download-png" type="button">PNG 다운로드</button>
            <button class="btn secondary" id="download-svg" type="button">SVG 다운로드</button>
            <button class="btn ghost" id="copy-png" type="button">PNG 복사</button>
          </div>
          <div id="copy-status" class="helper" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </div>

  <canvas id="png-canvas" style="display:none"></canvas>

  <script>
    const barcodeInput = document.getElementById("barcode-data");
    const displayTextInput = document.getElementById("display-text");
    const barWidthInput = document.getElementById("bar-width");
    const barHeightInput = document.getElementById("bar-height");
    const barMarginInput = document.getElementById("bar-margin");
    const fontSizeInput = document.getElementById("font-size");
    const displayValueToggle = document.getElementById("display-value");
    const displayLabelToggle = document.getElementById("display-label");

    const barcodeSvg = document.getElementById("barcodeSvg");
    const status = document.getElementById("status");
    const copyStatus = document.getElementById("copy-status");

    const downloadPngButton = document.getElementById("download-png");
    const downloadSvgButton = document.getElementById("download-svg");
    const copyPngButton = document.getElementById("copy-png");
    const canvas = document.getElementById("png-canvas");

    const BARCODE_FORMAT = "CODE128";
    const LABEL_GAP = 8;

    function toNumber(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : NaN;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function sanitizeFilename(text) {
      const trimmed = text.trim();
      if (!trimmed) return "barcode";
      return trimmed.replace(/[^a-z0-9\-_.]+/gi, "-").slice(0, 24) || "barcode";
    }

    function setStatus(message, isError = true) {
      status.textContent = message;
      status.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function removeExistingLabel() {
      const existingLabel = barcodeSvg.querySelector("text[data-role='label']");
      if (existingLabel) {
        existingLabel.remove();
      }
    }

    function findValueTextElement(svgElement) {
      const textElements = Array.from(svgElement.querySelectorAll("text")).filter(
        (textNode) => textNode.getAttribute("data-role") !== "label"
      );
      if (!textElements.length) {
        return null;
      }
      return textElements.reduce((currentMax, textNode) => {
        const yAttr = Number.parseFloat(textNode.getAttribute("y"));
        const currentMaxY = currentMax
          ? Number.parseFloat(currentMax.getAttribute("y"))
          : Number.NaN;
        if (Number.isFinite(yAttr) && Number.isFinite(currentMaxY)) {
          return yAttr > currentMaxY ? textNode : currentMax;
        }
        if (Number.isFinite(yAttr) && !Number.isFinite(currentMaxY)) {
          return textNode;
        }
        if (!Number.isFinite(yAttr) && Number.isFinite(currentMaxY)) {
          return currentMax;
        }
        const currentBox = currentMax ? currentMax.getBBox() : { y: 0, height: 0 };
        const textBox = textNode.getBBox();
        const currentBottom = currentBox.y + currentBox.height;
        const textBottom = textBox.y + textBox.height;
        return textBottom > currentBottom ? textNode : currentMax;
      }, null);
    }

    function updateBarcode() {
      const data = barcodeInput.value.trim();
      const barWidth = toNumber(barWidthInput.value);
      const barHeight = toNumber(barHeightInput.value);
      const barMargin = toNumber(barMarginInput.value);
      const fontSize = toNumber(fontSizeInput.value);
      const displayValue = displayValueToggle.checked;
      const labelText = displayTextInput.value.trim();
      const showLabel = displayLabelToggle.checked;

      copyStatus.textContent = "";

      if (!data) {
        barcodeSvg.innerHTML = "";
        setStatus("바코드 데이터를 입력해주세요.");
        return;
      }

      if (![barWidth, barHeight, barMargin, fontSize].every((value) => Number.isFinite(value))) {
        setStatus("옵션 값은 숫자여야 합니다.");
        return;
      }

      try {
        const widthValue = clamp(barWidth, 0.5, 6);
        const heightValue = clamp(barHeight, 20, 300);
        const marginValue = clamp(barMargin, 0, 50);
        const fontSizeValue = clamp(fontSize, 8, 40);

        JsBarcode(barcodeSvg, data, {
          format: BARCODE_FORMAT,
          lineColor: "#111827",
          background: "#ffffff",
          width: widthValue,
          height: heightValue,
          margin: marginValue,
          displayValue,
          fontSize: fontSizeValue
        });

        removeExistingLabel();

        if (labelText && showLabel) {
          const currentHeight = Number(barcodeSvg.getAttribute("height")) || 0;
          const currentWidth = Number(barcodeSvg.getAttribute("width")) || 0;
          const viewBox = barcodeSvg.getAttribute("viewBox");
          const viewBoxParts = viewBox ? viewBox.split(/\s+/).map((value) => Number(value)) : [];
          const viewBoxWidth = viewBoxParts.length === 4 ? viewBoxParts[2] : currentWidth;
          const valueTextElement = findValueTextElement(barcodeSvg);
          const valueTextY = valueTextElement
            ? Number.parseFloat(valueTextElement.getAttribute("y"))
            : Number.NaN;
          const barcodeBox = barcodeSvg.getBBox();
          const barcodeBottomY = barcodeBox.y + barcodeBox.height;
          const baseY = Number.isFinite(valueTextY) ? valueTextY : barcodeBottomY;
          const labelY = baseY + LABEL_GAP + fontSizeValue;

          const textElement = document.createElementNS("http://www.w3.org/2000/svg", "text");
          textElement.setAttribute("data-role", "label");
          textElement.setAttribute("x", "50%");
          textElement.setAttribute("text-anchor", "middle");
          textElement.setAttribute("y", String(labelY));
          textElement.setAttribute("fill", "#111827");
          textElement.setAttribute("font-size", String(fontSizeValue));
          textElement.setAttribute(
            "font-family",
            "system-ui, -apple-system, \"Segoe UI\", sans-serif"
          );
          textElement.textContent = labelText;
          barcodeSvg.appendChild(textElement);

          const labelBox = textElement.getBBox();
          const labelBottom = labelBox.y + labelBox.height;
          const newHeight = Math.max(currentHeight, labelBottom);

          barcodeSvg.setAttribute("height", String(newHeight));
          if (viewBoxWidth) {
            barcodeSvg.setAttribute("viewBox", `0 0 ${viewBoxWidth} ${newHeight}`);
          }
        }

        setStatus("");
      } catch (error) {
        barcodeSvg.innerHTML = "";
        setStatus("바코드 생성에 실패했습니다. 입력 값을 확인해주세요.");
      }
    }

    function getSvgString() {
      if (!barcodeSvg || !barcodeSvg.firstChild) return null;
      const serializer = new XMLSerializer();
      return serializer.serializeToString(barcodeSvg);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function svgToPng(svgString) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const svgBlob = new Blob([svgString], { type: "image/svg+xml" });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(url);
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("PNG 변환에 실패했습니다."));
            }
          });
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("이미지 로드에 실패했습니다."));
        };

        img.src = url;
      });
    }

    async function handleDownloadSvg() {
      const svgString = getSvgString();
      if (!svgString) {
        copyStatus.textContent = "SVG 다운로드 전에 바코드를 생성해주세요.";
        return;
      }
      const blob = new Blob([svgString], { type: "image/svg+xml" });
      const filename = `${sanitizeFilename(barcodeInput.value)}.svg`;
      downloadBlob(blob, filename);
      copyStatus.textContent = "SVG 다운로드를 시작했습니다.";
    }

    async function handleDownloadPng() {
      const svgString = getSvgString();
      if (!svgString) {
        copyStatus.textContent = "PNG 다운로드 전에 바코드를 생성해주세요.";
        return;
      }

      try {
        const pngBlob = await svgToPng(svgString);
        const filename = `${sanitizeFilename(barcodeInput.value)}.png`;
        downloadBlob(pngBlob, filename);
        copyStatus.textContent = "PNG 다운로드를 시작했습니다.";
      } catch (error) {
        copyStatus.textContent = "PNG 변환에 실패했습니다.";
      }
    }

    async function handleCopyPng() {
      const svgString = getSvgString();
      if (!svgString) {
        copyStatus.textContent = "복사 전에 바코드를 생성해주세요.";
        return;
      }

      if (!navigator.clipboard || !window.ClipboardItem) {
        copyStatus.textContent = "이 브라우저에서는 PNG 복사가 지원되지 않습니다.";
        return;
      }

      try {
        const pngBlob = await svgToPng(svgString);
        await navigator.clipboard.write([new ClipboardItem({ "image/png": pngBlob })]);
        copyStatus.textContent = "PNG가 클립보드에 복사되었습니다.";
      } catch (error) {
        copyStatus.textContent = "클립보드 복사에 실패했습니다.";
      }
    }

    function setupStepper(stepper) {
      const input = stepper.querySelector("input[type='number']");
      const down = stepper.querySelector("button[data-step='down']");
      const up = stepper.querySelector("button[data-step='up']");

      function adjust(direction) {
        const step = toNumber(input.step) || 1;
        const min = toNumber(input.min);
        const max = toNumber(input.max);
        const current = toNumber(input.value) || 0;
        const precision = (step.toString().split(".")[1] || "").length;
        const delta = direction === "up" ? step : -step;
        const nextValue = Number((current + delta).toFixed(Math.max(precision, 0)));
        const clamped = clamp(nextValue, Number.isFinite(min) ? min : nextValue, Number.isFinite(max) ? max : nextValue);
        input.value = clamped;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }

      down.addEventListener("click", () => adjust("down"));
      up.addEventListener("click", () => adjust("up"));
    }

    const inputs = [
      barcodeInput,
      displayTextInput,
      barWidthInput,
      barHeightInput,
      barMarginInput,
      fontSizeInput,
      displayValueToggle,
      displayLabelToggle
    ];

    inputs.forEach((input) => {
      input.addEventListener("input", updateBarcode);
      input.addEventListener("change", updateBarcode);
    });

    document.querySelectorAll("[data-stepper]").forEach(setupStepper);

    downloadSvgButton.addEventListener("click", handleDownloadSvg);
    downloadPngButton.addEventListener("click", handleDownloadPng);
    copyPngButton.addEventListener("click", handleCopyPng);

    updateBarcode();
  </script>
</body>
</html>
